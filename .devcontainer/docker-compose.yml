version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/bin/docker:/usr/local/bin/docker:ro
      - devcontainer-bashhistory:/commandhistory
      - devcontainer-extensions:/home/vscode/.vscode-server/extensions
    
    command: sleep infinity
    network_mode: host
    
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  devcontainer-bashhistory:
  devcontainer-extensions:
